[project]
name = "acquire"
version = "0.1.0"
description = "Acquire board game server and client."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pre-commit>=4,<5",
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<0.15",
    "ujson>=5.10,<6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test.py", "test_*.py", "*_test.py"]
addopts = "-ra"
markers = [
    "unit: fast tests that do not require external services",
    "integration: tests that exercise service boundaries",
    "golden: replay or fixture-based regression tests",
    "mysql: tests that require MySQL",
    "e2e: end-to-end smoke tests",
]

[tool.coverage.run]
branch = true
source = ["server"]
omit = [
    "server/settings.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = [
    "dist",
    "lib",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Keep the first pass intentionally lenient. Tighten this after golden tests
# protect the legacy behavior.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
files = ["server"]
ignore_missing_imports = true
follow_imports = "silent"
allow_untyped_defs = true
allow_incomplete_defs = true
check_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = false
strict_optional = false
show_error_codes = true
disable_error_code = [
    "misc",
    "valid-type",
    "var-annotated",
]
