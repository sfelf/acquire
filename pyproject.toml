[build-system]
requires = ["uv_build>=0.11.22,<0.12"]
build-backend = "uv_build"

[project]
name = "acquire"
version = "0.1.0"
description = "Acquire board game server and client."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2,<3",
    "trueskill==0.4.4",
    "ujson>=5.13,<6",
    "uvicorn>=0.32,<1",
    "websockets>=14,<16",
]

[project.optional-dependencies]
mysql-migration = [
    "mysql-connector-python>=9.3,<10",
]

[dependency-groups]
dev = [
    "alembic>=1.17,<2",
    "httpx>=0.27,<1",
    "mypy>=1.18,<2",
    "pre-commit>=4,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test.py", "test_*.py", "*_test.py"]
addopts = "-ra"
markers = [
    "unit: fast tests that do not require external services",
    "integration: tests that exercise service boundaries",
    "golden: replay or fixture-based regression tests",
    "postgres: tests that require Postgres",
    "e2e: end-to-end smoke tests",
]

[tool.coverage.run]
branch = true
source = ["server"]
omit = [
    "server/settings.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "dist",
    "lib",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "A",
    "PIE",
    "RSE",
    "ISC",
    "ICN",
    "COM818",
    "COM819",
    "RUF021",
]

[tool.mypy]
python_version = "3.12"
files = ["server"]
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
[[tool.mypy.overrides]]
module = [
    "orm",
]
disable_error_code = [
    "misc",
    "valid-type",
]
