name: CI

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - feature/modernization-refactor
      - main

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install tooling
        run: uv sync --group dev --frozen

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Report coverage
        run: uv run pytest --cov=server --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Update coverage badge
        if: matrix.python-version == '3.13' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          uv run python scripts/update_coverage_badge.py
          if ! git diff --quiet -- .github/badges/coverage.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges/coverage.svg
            git commit -m "Update coverage badge"
            git push
          fi
