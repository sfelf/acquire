name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install tooling
        run: uv sync --group dev --frozen

      - name: Verify package
        run: uv run python scripts/verify_distribution.py

      - name: Verify runtime dependency boundaries
        run: |
          uv run --isolated --frozen --no-dev python - <<'PY'
          import importlib.util
          import sys

          import acquire.migration.import_mysql_to_postgres
          import acquire.migration.validate_import_reports
          import acquire.stats

          assert "acquire.orm" not in sys.modules
          assert "trueskill" not in sys.modules
          assert importlib.util.find_spec("mysql") is None

          import acquire.http_server

          PY
          uv run --isolated --frozen --no-dev --extra mysql-migration python - <<'PY'
          import mysql.connector

          import acquire.migration.import_mysql_to_postgres
          PY

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Report coverage
        run: uv run pytest --cov=src/acquire --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-marker-tests:
    name: Docker marker tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install tooling
        run: uv sync --group dev --frozen

      - name: Run Postgres marker tests
        run: uv run pytest -m postgres

      - name: Run e2e marker tests
        run: uv run pytest -m e2e
