name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install tooling
        run: uv sync --group dev --frozen

      - name: Verify package
        run: |
          uv run python -c "import acquire"
          uv build --no-sources
          artifacts=("$GITHUB_WORKSPACE"/dist/*)
          test "${#artifacts[@]}" -eq 2
          for artifact in "${artifacts[@]}"; do
            artifact_test_dir="$(mktemp -d)"
            uv venv --python "${{ matrix.python-version }}" \
              "$artifact_test_dir/.venv"
            uv pip install --python "$artifact_test_dir/.venv/bin/python" \
              "$artifact"
            (
              cd "$artifact_test_dir"
              .venv/bin/python -c \
                "from pathlib import Path; import importlib.util; import acquire; import acquire.enums; import acquire.orm; import acquire.settings; import acquire.username_to_user_id; import acquire.util; assert 'site-packages' in Path(acquire.__file__).parts; assert importlib.util.find_spec('mysql') is None"
            )
          done

      - name: Verify runtime dependency boundaries
        run: |
          uv run --isolated --frozen --no-dev python - <<'PY'
          import importlib.util
          import sys

          sys.path.insert(0, "server")
          import cron
          import http_server

          assert importlib.util.find_spec("mysql") is None
          PY
          uv run --isolated --frozen --no-dev --extra mysql-migration python - <<'PY'
          import sys

          import mysql.connector

          sys.path.insert(0, "server")
          import import_mysql_to_postgres
          PY

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Report coverage
        run: uv run pytest --cov=server --cov=src/acquire --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-marker-tests:
    name: Docker marker tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install tooling
        run: uv sync --group dev --frozen

      - name: Run Postgres marker tests
        run: uv run pytest -m postgres

      - name: Run e2e marker tests
        run: uv run pytest -m e2e
