# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Keep routine updates aligned with the repository's independently tested
    # dependency boundaries. Major updates fall through to individual PRs so
    # that they cannot be silently combined with unrelated compatibility work.
    groups:
      lint-type-pre-commit-tooling:
        patterns:
          - "mypy"
          - "pre-commit"
          - "ruff"
        update-types:
          - "minor"
          - "patch"
      packaging-build-backend:
        patterns:
          - "uv-build"
        update-types:
          - "minor"
          - "patch"
      http-websocket-runtime:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "websockets"
        update-types:
          - "minor"
          - "patch"
      persistence-migration-runtime:
        patterns:
          - "alembic"
          - "psycopg"
        update-types:
          - "minor"
          - "patch"
      rating-runtime:
        patterns:
          - "trueskill"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      client-build-dependencies:
        patterns:
          - "*"
