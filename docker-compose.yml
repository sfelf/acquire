services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acquire}
      MYSQL_USER: ${MYSQL_USER:-acquire}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acquire}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-socket:/var/run/mysqld

  python-server:
    build:
      context: .
      dockerfile: Dockerfile.local
    profiles:
      - legacy-node
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acquire}
      MYSQL_USER: ${MYSQL_USER:-acquire}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acquire}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      MYSQL_AUTH_PLUGIN: ""
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /app/server/python.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - .:/app
      - mysql-socket:/var/run/mysqld
    working_dir: /app/server
    command: sh -c "rm -f python.sock && python server.py"

  client-enums:
    build:
      context: .
      dockerfile: Dockerfile.local
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "python server/enumsgen.py js development > client/main/js/enums.js"

  client-assets:
    image: node:6
    depends_on:
      client-enums:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    working_dir: /app
    command: >
      sh -c "npm install
      && ./node_modules/.bin/node-sass --style expanded --sourcemap=none --no-cache client/main/css/main.scss client/main/css/main.css
      && ./node_modules/.bin/node-sass --style expanded --sourcemap=none --no-cache client/stats/css/stats.scss client/stats/css/stats.css
      && ./node_modules/webpack/bin/webpack.js -d client/main/js/app.js client/main/js/main.js"

  python-gateway:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acquire}
      MYSQL_USER: ${MYSQL_USER:-acquire}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acquire}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      MYSQL_AUTH_PLUGIN: ""
    depends_on:
      client-assets:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/sockjs/info >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "${ACQUIRE_UI_PORT:-9000}:9000"
    volumes:
      - .:/app
      - mysql-socket:/var/run/mysqld
    working_dir: /app/server
    command: sh -c "python http_server.py --host 0.0.0.0 --port 9000"

  node-gateway:
    image: node:6
    profiles:
      - legacy-node
    environment:
      JAVASCRIPT_PORT: 9000
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acquire}
      MYSQL_USER: ${MYSQL_USER:-acquire}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acquire}
      MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      SERVE_CLIENT_STATIC: "1"
    depends_on:
      client-assets:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      python-server:
        condition: service_healthy
    ports:
      - "${ACQUIRE_LEGACY_UI_PORT:-9001}:9000"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - mysql-socket:/var/run/mysqld
    working_dir: /app/server
    command: sh -c "rm -f javascript.sock && node server.js"

volumes:
  mysql-data:
  mysql-socket:
  node-modules:
