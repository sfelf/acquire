services:
  mysql:
    image: mysql:8.0
    profiles:
      - mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acquire}
      MYSQL_USER: ${MYSQL_USER:-acquire}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acquire}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-socket:/var/run/mysqld

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acquire}
      POSTGRES_USER: ${POSTGRES_USER:-acquire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acquire}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  client-enums:
    build:
      context: .
      dockerfile: Dockerfile.local
    profiles:
      - client-build
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "python server/enumsgen.py js development > client/main/js/enums.js"

  client-assets:
    image: node:6
    profiles:
      - client-build
    depends_on:
      client-enums:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    working_dir: /app
    command: >
      sh -c "npm install
      && ./node_modules/.bin/node-sass --style expanded --sourcemap=none --no-cache client/main/css/main.scss client/main/css/main.css
      && ./node_modules/.bin/node-sass --style expanded --sourcemap=none --no-cache client/stats/css/stats.scss client/stats/css/stats.css
      && ./node_modules/webpack/bin/webpack.js -d client/main/js/app.js client/main/js/main.js"

  python-gateway:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acquire}
      POSTGRES_USER: ${POSTGRES_USER:-acquire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acquire}
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/sockjs/info >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "${ACQUIRE_UI_PORT:-9000}:9000"
    volumes:
      - .:/app
    working_dir: /app/server
    command: >
      sh -c "test -f /app/client/main/js/main.js
      && test -f /app/client/main/css/main.css
      && test -f /app/client/stats/css/stats.css
      || { echo 'Run docker compose --profile client-build run --rm client-assets before starting python-gateway.'; exit 1; }
      && python http_server.py --host 0.0.0.0 --port 9000"

volumes:
  mysql-data:
  mysql-socket:
  postgres-data:
  node-modules:
